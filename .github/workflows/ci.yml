name: CI

# Test every PR and every push to main; publish the image only when main moves
# (ADR 0021) or a version tag is pushed (#496). Pull requests also build and
# smoke-test the runtime image.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: pytest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Four, not three (#475): three put both slow files in one shard, 4.5x
        # the lightest and over the 10-minute job budget.
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the production frontend
        run: npm ci && npm run build
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
      - name: Sync deps (api + sync extras, from the lockfile)
        run: uv sync --frozen --extra api --extra sync
      # Every test file, sorted, dealt round-robin across the shards. An empty
      # shard fails rather than passing on zero tests.
      - name: Run the selected backend files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          files=$(python3 -c 'import os, pathlib; k, n = map(int, os.environ["SHARD"].split("/")); files = sorted(str(p) for p in pathlib.Path("tests").rglob("*.py") if p.name.startswith("test_") or p.name.endswith("_test.py")); print(" ".join(files[k - 1::n]))')
          test -n "$files"
          uv run python -m pytest $files

  generators:
    name: generator drift checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the production frontend
        run: npm ci && npm run build
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
      - name: Sync deps (api + sync extras, from the lockfile)
        run: uv sync --frozen --extra api --extra sync
      # The chart-builder fixtures (#728) are real analyze()/timeline()/
      # scenario-engine output over invented inputs, not literals — see
      # scripts/gen_chart_builder_fixtures.py. This fails the build if a
      # producer moves and the fixture isn't regenerated.
      - name: Check the generated chart-builder fixtures are current
        run: uv run python scripts/gen_chart_builder_fixtures.py --check
      # A live app revision may use only this manufactured local store. Keep its
      # logical SQLite contents tied to the committed generator before any
      # supervised no-fetch server run is authorized.
      - name: Check the QA E2E synthetic database is current
        timeout-minutes: 3
        run: uv run python scripts/gen_qa_e2e_db.py --check
      # #730: the findings queue is a server-owned projection, and its fixture is
      # that projection's own output over inputs run through the real engines.
      - name: Check the generated findings-projection fixtures are current
        run: uv run python scripts/gen_findings_projection_fixtures.py --check
      - name: Check the generated missed-meal comparison fixture is current
        run: uv run python scripts/gen_missed_meal_comparison_fixtures.py --check
      # #483: the component library's stories render these served answers; a
      # fixture that drifted from its generator is a story checking stale data.
      - name: Check the generated component-library fixtures are current
        run: uv run python scripts/gen_ui_fixtures.py --check

  backend:
    name: pytest (backend)
    needs: [backend-tests, generators]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every backend shard and generator check
        env:
          TESTS_RESULT: ${{ needs.backend-tests.result }}
          GENERATORS_RESULT: ${{ needs.generators.result }}
        run: test "$TESTS_RESULT" = success && test "$GENERATORS_RESULT" = success

  docs:
    name: ADR numbering guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Stdlib-only guard — no deps, no setup. Fails on duplicate ADR numbers or a
      # heading/filename mismatch, catching parallel-branch collisions at PR time
      # instead of at merge (see scripts/check_adr_numbers.py).
      - name: Check ADR numbers
        run: python3 scripts/check_adr_numbers.py
      - name: Check owned identifiers
        run: python3 scripts/check_owned_identifiers.py
      # #728: fails when a tracked path clears neither an allowlist positive
      # rule nor an exact-path deny — the mechanism the public-repository
      # cutover's build script reads (scripts/check_public_allowlist.py).
      - name: Check public-repository allowlist
        run: python3 scripts/check_public_allowlist.py
      # #728: materialise the tree the allowlist describes ONCE, then run both
      # checks that only mean anything against the bytes that actually publish.
      #
      # The link check: docs/adr/, docs/scope/ and most of mockups/ do not ship,
      # so a link or prose pointer into one of them reads fine in this repository
      # and is a dead end in the published one.
      #
      # The contamination scan (plan §3.1) is the one mechanical check standing
      # between a private health record and a public repository. It runs over the
      # MATERIALISED tree, not the source repo, because the tree is what gets
      # published — and it fails closed: a file it cannot parse is a failure,
      # never a skip.
      - name: Check and scan the materialised public tree
        run: |
          python3 scripts/build_public_tree.py "$RUNNER_TEMP/public-tree" > "$RUNNER_TEMP/public-tree-manifest.txt"
          tail -n 1 "$RUNNER_TEMP/public-tree-manifest.txt"
          python3 scripts/check_public_links.py "$RUNNER_TEMP/public-tree"
          python3 scripts/scan_public_tree.py "$RUNNER_TEMP/public-tree"

  # The frontend gate (#495): the component library's Storybook suite, the
  # dependency-free node tests and OpenSpec. The served app is the app job's.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: "1.61.1"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      # Pinned to an exact release: a floating major lets an upstream rule
      # change fail main with no commit here (1.14.1 turned >500-character
      # requirement text into a strict-mode failure). Raise the pin on purpose.
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.14.0 validate --all --strict
      # Pure-logic frontend modules are tested with Node's built-in runner —
      # no npm dependency. The one source root is named explicitly: a glob
      # that does not name a root is a runner no new test is ever seen by.
      - name: Run the node tests
        run: node --test 'frontend/**/*.test.js'
      - name: Exercise the local screenshot wrapper
        run: node --test scripts/screenshots.local.test.mjs
      - name: Install the frontend and build the app
        run: npm ci && npm run build
      # An isolated Playwright and Chromium for the story check, outside the
      # app's own dependencies; restored from cache when the pin is unchanged.
      - name: Restore the isolated browser runner and Chromium
        id: browser-runner-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ciq-playwright
            ${{ runner.temp }}/ciq-playwright-browsers
          key: ui-stories-${{ runner.os }}-node-22-playwright-${{ env.PLAYWRIGHT_VERSION }}-v1
      - name: Install the isolated browser runner
        if: steps.browser-runner-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/ciq-playwright" "playwright@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ciq-playwright-browsers
        run: npx --prefix "$RUNNER_TEMP/ciq-playwright" playwright install --with-deps chromium
      # Every story, checked after its play: no sentence, only allowed words,
      # one size per control role, one primary, every number traced to its
      # field, and nothing scrolling but a page.
      - name: Run the Storybook suite
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ciq-playwright-browsers
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ciq-playwright/node_modules/playwright
        run: npm run test:ui

  # The app against the engine (#475), in place of the desk's behaviour
  # ledgers: the live adapter's contract tests and one browser smoke test,
  # each run against the one permitted offline serve (a scratch copy of a
  # synthetic QA store, warmed, --no-fetch, an empty token) that smoke_app
  # boots after asking it for the app and an API answer. Hand-listed, never
  # globbed.
  app:
    name: app contract + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_VERSION: "1.61.1"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install the frontend and build the app
        run: npm ci && npm run build
      - name: Restore the isolated browser runner and Chromium
        id: browser-runner-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ciq-playwright
            ${{ runner.temp }}/ciq-playwright-browsers
          key: ui-stories-${{ runner.os }}-node-22-playwright-${{ env.PLAYWRIGHT_VERSION }}-v1
      - name: Install the isolated browser runner
        if: steps.browser-runner-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/ciq-playwright" "playwright@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ciq-playwright-browsers
        run: npx --prefix "$RUNNER_TEMP/ciq-playwright" playwright install --with-deps chromium
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
      - name: Sync deps (api extra, from the lockfile)
        run: uv sync --frozen --extra api
      # The showcase: every tab's screen model from the live adapter, then the
      # built app opening each of its five tabs in Chromium at one size.
      - name: Contract-test the live adapter and smoke-test the app on the showcase
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ciq-playwright-browsers
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ciq-playwright/node_modules/playwright
        run: >-
          uv run python scripts/smoke_app.py --then
          node --test frontend/ui/app/live.contract.test.mjs frontend/app.browser.test.mjs
      # Named case stores for what the showcase does not hold: an active basal
      # Trial in Changes, Day findings of five kinds, a queued carb ratio, a
      # Pattern served as its habit whose count its habit's own count would
      # understate, and a maturing carb ratio Trial retained by an earlier
      # release (#554).
      - name: Contract-test the live adapter on active Trials, Day findings, a queued I:C, a collapsed Pattern and a two-cause Pattern
        run: |
          uv run python scripts/smoke_app.py --case c3-trial --then node --test frontend/ui/app/live.contract.test.mjs
          uv run python scripts/smoke_app.py --case c3-ic-trial --then node --test frontend/ui/app/live.contract.test.mjs
          uv run python scripts/smoke_app.py --case pattern-correction-fold --then node --test frontend/ui/app/live.contract.test.mjs
          uv run python scripts/smoke_app.py --case basal-and-carb-ratio-lower --then node --test frontend/ui/app/live.contract.test.mjs
          uv run python scripts/smoke_app.py --case pattern-correction-collapse --then node --test frontend/ui/app/live.contract.test.mjs
          uv run python scripts/smoke_app.py --case behavioral-missed-meal --then node --test frontend/ui/app/live.contract.test.mjs
          uv run python scripts/smoke_app.py --case pattern-meal-two-causes --then node --test frontend/ui/app/live.contract.test.mjs

  docker-pr:
    name: build + smoke-test image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: harmonic:pr-test
      - name: Require an image with no Node runtime
        run: docker run --rm --entrypoint sh harmonic:pr-test -c '! command -v node'
      # The image serves the synthetic QA store with no fetch and a token, and
      # the smoke test asks it for the app and an authenticated API answer. A
      # directory is mounted, not just the database: the non-root runtime needs
      # WAL space beside it.
      - name: Serve the synthetic store from the image and smoke-test it
        run: |
          data="$RUNNER_TEMP/container-data"
          mkdir -p "$data" && chmod 777 "$data"
          cp mockups/qa-e2e.synthetic/harmonic.sqlite "$data/harmonic.sqlite" && chmod 666 "$data/harmonic.sqlite"
          docker run --detach --name harmonic-smoke --publish 127.0.0.1:8765:8765 \
            --env TIMEZONE_NAME=America/Phoenix --volume "$data:/app/tconnect-data" harmonic:pr-test \
            --host 0.0.0.0 --port 8765 --no-fetch --token smoke-token --db /app/tconnect-data/harmonic.sqlite
          python3 scripts/smoke_app.py --url http://127.0.0.1:8765 --token smoke-token
      - name: Show the container log
        if: always()
        run: docker logs harmonic-smoke || true

  docker:
    name: build + push image
    needs: [backend, docs, frontend, app]
    # Only on a real push to main or of a version tag — never on PRs or forks.
    # A tag push runs the same full gates as main: no job above filters on the ref.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image paths must be lowercase; the repo name is mixed-case.
      # latest tracks main; the full SHA gives a traceable pin. A version tag
      # vX.Y.Z publishes X.Y.Z only, so a release never moves latest.
      - name: Compute the lowercase image tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="$name:${GITHUB_REF_NAME#v}"
          else
            tags="$name:latest"$'\n'"$name:$GITHUB_SHA"
          fi
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
      # The prune's ignore-versions regex is tested against a container
      # version's name, which is its digest, never its tags. So list the
      # digests carrying a release tag X.Y.Z and exempt exactly those. An
      # exempted version is also left out of the ten kept, so main keeps ~10
      # merges pullable on top of every release. With no release, ^()$ matches no digest.
      - name: Find release-tagged image versions to keep
        if: github.ref == 'refs/heads/main'
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          digests=$(gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/harmonic/versions?per_page=100" \
            --jq '.[] | select(any(.metadata.container.tags[]; test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .name' | paste -sd '|' -)
          echo "ignore=^(${digests})\$" >> "$GITHUB_OUTPUT"
      # Keep the 10 most recent published versions. A build pushing latest+SHA
      # is one version with two tags, so this keeps ~10 merges pullable.
      # min-versions-to-keep is a no-op when nothing is eligible for pruning.
      - name: Prune old image versions
        if: github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5
        with:
          package-name: harmonic
          package-type: container
          min-versions-to-keep: 10
          ignore-versions: ${{ steps.releases.outputs.ignore }}
