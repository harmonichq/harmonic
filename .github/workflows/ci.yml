name: CI

# Test every PR and every push to main; publish the image only when main moves
# (ADR 0021). Pull requests also build and smoke-test the runtime image.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: pytest shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the production frontend
        run: npm ci && npm run build
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
      - name: Sync deps (api + sync extras, from the lockfile)
        run: uv sync --frozen --extra api --extra sync
      - name: Run the selected backend files
        run: uv run python mockups/sweep/harmonic-v2-desktop/acceptance.py pytest --shard "${{ matrix.shard }}" --out "$RUNNER_TEMP/pytest-${{ strategy.job-index }}"
      - name: Retain backend shard inventory and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/pytest-*/*.json
            ${{ runner.temp }}/pytest-*/pytest.log

  generators:
    name: generator drift checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the production frontend
        run: npm ci && npm run build
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.25"
      - name: Sync deps (api + sync extras, from the lockfile)
        run: uv sync --frozen --extra api --extra sync
      - name: Check the runtime acceptance probe rejects incomplete proofs
        run: uv run python mockups/sweep/harmonic-v2-desktop/acceptance.test.py
      - name: Check generated case caching
        run: uv run python mockups/sweep/harmonic-v2-desktop/acceptance.py case-cache --check --out "$RUNNER_TEMP/case-cache"
      - name: Check guidance instruction and Plan parity
        run: node scripts/check_guidance_plan_contract.mjs
      # The frontend's I:C block fixtures are real analyzer output, not literals
      # (#518). If a gate moves and the fixture isn't regenerated, the frontend tests
      # keep asserting a verdict the analyzer no longer produces — the #273 trap in a
      # new place. This fails the build instead.
      - name: Check the generated I:C block fixtures are current
        run: uv run python scripts/gen_ic_block_fixtures.py --check
      - name: Check the generated evidence-canvas exploration is current
        run: uv run python mockups/diagnose-evidence-canvas.exploration/generate.py --check
      - name: Check the generated v2 design evidence and app material are current
        run: uv run python mockups/harmonic-v2.exploration/generate.py --check
      # Same drift class, the engine-authored annotation copy the Settings audit
      # renders verbatim (#536).
      - name: Check the generated annotation fixtures are current
        run: uv run python scripts/gen_annotation_fixtures.py --check
      # Same drift class again: the three chart-builder fixtures (#728) are real
      # analyze()/timeline()/scenario-engine output over invented inputs, not
      # literals — see scripts/gen_chart_builder_fixtures.py.
      - name: Check the generated chart-builder fixtures are current
        run: uv run python scripts/gen_chart_builder_fixtures.py --check
      # #716: the two committed synthetic demo sets under mockups/ (Verify,
      # Diagnose) are generator output, not hand-written — regenerate both into a
      # temp dir and byte-compare against the committed copy.
      - name: Check the committed demo fixture sets are current
        run: uv run python scripts/check_demo_fixtures.py
      # A live app revision may use only this manufactured local store. Keep its
      # logical SQLite contents tied to the committed generator before any
      # supervised no-fetch server run is authorized.
      - name: Check the QA E2E synthetic database is current
        timeout-minutes: 3
        run: uv run python scripts/gen_qa_e2e_db.py --check
      # #730: the Diagnose findings queue is a server-owned projection, and its
      # fixture is that projection's own output over inputs run through the real
      # engines. A classification, merge, anchoring or ordering change that is not
      # regenerated would leave the fixture describing a window the server no longer
      # returns — the same drift class as the two checks above.
      - name: Check the generated findings-projection fixtures are current
        run: uv run python scripts/gen_findings_projection_fixtures.py --check
      - name: Check the generated I:C history-event fixtures are current
        run: uv run python scripts/gen_ic_history_event_fixtures.py --check
      - name: Check the generated current I:C block-evidence fixtures are current
        run: uv run python scripts/gen_ic_block_evidence_fixtures.py --check
      - name: Check the generated basal-night-evidence fixtures are current
        run: uv run python scripts/gen_basal_night_evidence_fixtures.py --check
      - name: Check the generated ISF rest-window evidence fixtures are current
        run: uv run python scripts/gen_isf_rest_window_evidence_fixtures.py --check
      - name: Check the generated missed-meal comparison fixture is current
        run: uv run python scripts/gen_missed_meal_comparison_fixtures.py --check
      - name: Check the generated eating-sequence report fixture is current
        run: uv run python scripts/gen_eating_sequence_fixtures.py --check

  backend:
    name: pytest (backend)
    needs: [backend-tests, generators]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require every backend shard and generator check
        env:
          TESTS_RESULT: ${{ needs.backend-tests.result }}
          GENERATORS_RESULT: ${{ needs.generators.result }}
        run: test "$TESTS_RESULT" = success && test "$GENERATORS_RESULT" = success

  latest-nightly:
    name: latest nightly
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Require the latest completed main nightly aggregate to be green and fresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 mockups/sweep/harmonic-v2-desktop/acceptance.py nightly --out "$RUNNER_TEMP/latest-nightly"
      - name: Retain the nightly result consulted by this PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-nightly
          path: ${{ runner.temp }}/latest-nightly/nightly.json

  docs:
    name: ADR numbering guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Stdlib-only guard — no deps, no setup. Fails on duplicate ADR numbers or a
      # heading/filename mismatch, catching parallel-branch collisions at PR time
      # instead of at merge (see scripts/check_adr_numbers.py).
      - name: Check ADR numbers
        run: python3 scripts/check_adr_numbers.py
      - name: Check owned identifiers
        run: python3 scripts/check_owned_identifiers.py
      # #728: fails when a tracked path clears neither an allowlist positive
      # rule nor an exact-path deny — the mechanism the public-repository
      # cutover's build script reads (scripts/check_public_allowlist.py).
      - name: Check public-repository allowlist
        run: python3 scripts/check_public_allowlist.py
      # #728: materialise the tree the allowlist describes ONCE, then run both
      # checks that only mean anything against the bytes that actually publish.
      #
      # The link check: docs/adr/, docs/scope/ and most of mockups/ do not ship,
      # so a link or prose pointer into one of them reads fine in this repository
      # and is a dead end in the published one.
      #
      # The contamination scan (plan §3.1) is the one mechanical check standing
      # between a private health record and a public repository. It runs over the
      # MATERIALISED tree, not the source repo, because the tree is what gets
      # published — and it fails closed: a file it cannot parse is a failure,
      # never a skip.
      - name: Check and scan the materialised public tree
        run: |
          python3 scripts/build_public_tree.py "$RUNNER_TEMP/public-tree" > "$RUNNER_TEMP/public-tree-manifest.txt"
          tail -n 1 "$RUNNER_TEMP/public-tree-manifest.txt"
          python3 scripts/check_public_links.py "$RUNNER_TEMP/public-tree"
          python3 scripts/scan_public_tree.py "$RUNNER_TEMP/public-tree"

  frontend:
    name: node --test (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1 validate --all --strict
      # Pure-logic frontend modules are tested with Node's built-in runner —
      # no npm dependency; the dev-only harness/ is not exercised here. Both
      # source roots are named: frontend-v2/ is the v2 desk (#389), and a glob
      # that does not name it is a runner no new test is ever seen by.
      - name: Run tests
        run: node --test 'frontend/**/*.test.js' 'frontend-v2/**/*.test.js'
      # The browser capture is generated too; a passing test must not run
      # against bytes that have drifted from its support-stamp producer.
      - name: Check the event-comparison synthetic capture is current
        run: node mockups/diagnose-event-comparison.synthetic/generate.mjs --check
      - name: Exercise the local screenshot wrapper
        run: node --test scripts/screenshots.local.test.mjs
      # The same drift class the backend job guards for its five generators, in
      # the one place it was never applied. The finding->evidence exploration
      # commits three GENERATED artifacts: app-base.extracted.css and
      # evidence-table.extracted.js are lifted verbatim out of
      # frontend/index.html and frontend/diagnose-workstation.js, and data.json
      # is fixture data run through the shipped queue/chart/dock producers. All
      # three move when the app moves, and until now nothing noticed. The light
      # relight (63d9053) left the extracted stylesheet on the retired parchment
      # tokens, so the exploration's own contrast guard spent an entire round
      # measuring a theme the app had already left and reporting zero failures.
      # Node-only and dependency-free — it regenerates in memory and byte-
      # compares, so it belongs in the fast gate rather than behind Chromium.
      - name: Check the exploration's generated artifacts are current
        run: node mockups/finding-evidence-routing.exploration/build.mjs --check

  browser-gate-setup:
    name: browser gate setup
    runs-on: ubuntu-latest
    # Playwright and Chromium install only on a cache miss. npm ci (warm from
    # the lockfile-keyed cache) and the Vite build run every time.
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: "1.61.1"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the delivered frontend shell
        run: npm ci && npm run build
      # The matrix restores this exact runner + browser bundle after this one job
      # creates it. Keeping the version in both the install and cache key prevents
      # a pinned Playwright upgrade from reusing an incompatible browser download.
      - name: Restore the isolated browser runner and Chromium
        id: browser-runner-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ciq-playwright
            ${{ runner.temp }}/ciq-playwright-browsers
          key: browser-gates-${{ runner.os }}-node-22-playwright-${{ env.PLAYWRIGHT_VERSION }}-v1
      - name: Install the isolated browser runner
        if: steps.browser-runner-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/ciq-playwright" "playwright@$PLAYWRIGHT_VERSION"
      - name: Install Chromium
        if: steps.browser-runner-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ciq-playwright-browsers
        run: npx --prefix "$RUNNER_TEMP/ciq-playwright" playwright install --with-deps chromium

  frontend-browser-leg:
    name: browser gates — ${{ matrix.gate }}
    needs: browser-gate-setup
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PLAYWRIGHT_VERSION: "1.61.1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: Day lifecycle
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" node frontend/day-surface.browser.mjs
          - gate: Diagnose workstation
            timeout: 10
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" PAYLOAD=mockups/diagnose-workstation.synthetic/payload.json node --test frontend/diagnose-workstation.browser.test.mjs
          - gate: Diagnose canvas composition
            timeout: 6
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" PAYLOAD=mockups/diagnose-workstation.synthetic/payload.json node --test frontend/diagnose-canvas-composition.browser.test.mjs
          - gate: Cockpit shell
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" node --test frontend/cockpit-shell.browser.test.mjs
      # #554: the shared browser-runner.js front door itself — proves it
      # launches Chromium once per command and still isolates scenarios.
      # #672: fails closed like every other browser gate, so it's a
      # `.browser.test.mjs` (not `.test.js`) and only runs here.
          - gate: Browser runner lifecycle
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" node --test frontend/browser-runner.browser.test.mjs
      # #389: the v2 desk's own browser gate. Browser suites are never
      # discovered by a glob in this repository — they are hand-listed matrix
      # entries — so the new source root gets its own step here, and chunks 2, 3
      # and 4 add theirs beside it. It serves the BUILT desk from disk and
      # answers the API from manufactured payloads in the driver, so it needs no
      # Python and no server.
          - gate: V2 desk
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" node --test frontend-v2/desk.browser.test.mjs
          - gate: V2 Trial and Pattern Focus
            timeout: 30
            python: true
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" node --test frontend-v2/follow-up.browser.test.mjs
          - gate: First-plan reconcile
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" node frontend/plan-first-match.browser.mjs
      # The behaviour replay is a .replay.mjs, which the `frontend/**/*.test.js`
      # glob never discovers, so it gets its own explicit step. It fails closed —
      # a missing driver, built shell or fixture exits nonzero rather than
      # skipping, because a green step that ran zero stories proves nothing.
      #
      # This surface has shipped (#722): the app is now the contract artifact,
      # so this is the only leg — the same stories and assertions, against the
      # BUILT workstation through the app opener, whose route stubs serve the
      # synthetic set's API-shaped payload. The mock (and its TARGET=mock CI
      # leg) has been archived; the anti-drift guarantee lives on in these
      # stories replaying against the built app forever.
          - gate: Diagnose workstation behaviour ledger
            timeout: 20
            server: true
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" BASE_URL=http://127.0.0.1:8765 TARGET=app PAYLOAD=mockups/diagnose-workstation.synthetic/payload.json node frontend/diagnose-workstation-behavior.replay.mjs
      # #677/#694: Meals/Lows extend Diagnose with an eleven-story contract.
      # S12 mutates glucose after the mock's former server-owned support facts
      # were computed, so its production aggregation regression is app-only
      # (#706). This surface has shipped (#722): the app is now the contract
      # artifact, so only the app leg remains, running every frozen story
      # (S1–S12). It fails closed when browser infrastructure or a fixture is
      # absent (#672).
          - gate: Diagnose event comparisons
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" TARGET=app node frontend/diagnose-event-comparison-behavior.replay.mjs
          - gate: Diagnose comparison support audit
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" TARGET=app node mockups/diagnose-event-comparison-support-audit.mjs
      # #660: the Verify workstation's own frozen ledger. This surface has
      # shipped (#722): the app is now the contract artifact, so this is the
      # only leg — the regression gate the port owes, rendering the committed
      # synthetic set. It fails closed — a run that executes zero stories
      # exits nonzero.
          - gate: Verify behaviour ledger
            timeout: 5
            command: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ciq-playwright/node_modules/playwright" TARGET=app PAYLOAD=mockups/verify-660-story.synthetic/payload.json node frontend/verify-660-story-behavior.replay.mjs
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the delivered frontend shell
        run: npm ci && npm run build
      - name: Set up uv for the no-fetch app server
        if: matrix.server || matrix.python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the API runtime for the no-fetch app server
        if: matrix.server || matrix.python
        run: uv sync --frozen --extra api
      - name: Restore the isolated browser runner and Chromium
        id: browser-runner-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ciq-playwright
            ${{ runner.temp }}/ciq-playwright-browsers
          key: browser-gates-${{ runner.os }}-node-22-playwright-${{ env.PLAYWRIGHT_VERSION }}-v1
      - name: Require the browser runner cache
        if: steps.browser-runner-cache.outputs.cache-hit != 'true'
        run: exit 1
      - name: Start the declared synthetic no-fetch app server
        if: matrix.server
        run: |
          cp mockups/qa-e2e.synthetic/harmonic.sqlite "$RUNNER_TEMP/harmonic-qa.sqlite"
          uv run harmonic serve --no-fetch --token '' --db "$RUNNER_TEMP/harmonic-qa.sqlite" > "$RUNNER_TEMP/harmonic-no-fetch.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/harmonic-no-fetch.log"
          exit 1
      - name: Run browser gate
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ciq-playwright-browsers
        run: ${{ matrix.command }}

  v2-ledger-plan:
    name: select v2 ledger shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPLAY_SHARDS: '{"smoke":["1/1"],"full":["1/4","2/4","3/4","4/4"]}'
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Select before expanding the browser matrix
        id: plan
        env:
          SMOKE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          args=()
          if [[ -n "$SMOKE_BASE" ]]; then args+=(--base "$SMOKE_BASE"); fi
          python3 mockups/sweep/harmonic-v2-desktop/acceptance.py replay-plan "${args[@]}" --out "$RUNNER_TEMP/v2-plan"
      - name: Retain the selection and planned shard inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-plan
          path: ${{ runner.temp }}/v2-plan/

  v2-ledger:
    name: browser gates — V2 ${{ needs.v2-ledger-plan.outputs.mode }} ledger ${{ matrix.viewport }} ${{ matrix.shard }} (${{ needs.v2-ledger-plan.outputs.count }} selected)
    needs: [browser-gate-setup, v2-ledger-plan]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.v2-ledger-plan.outputs.mode == 'full' && 18 || 60 }}
    env:
      PLAYWRIGHT_VERSION: "1.61.1"
    strategy:
      fail-fast: false
      matrix:
        viewport: [1280x720, 1440x900]
        shard: ${{ fromJSON(needs.v2-ledger-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build the delivered frontend shell
        run: npm ci && npm run build
      - name: Set up uv for the no-fetch app server
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the API runtime for the no-fetch app server
        run: uv sync --frozen --extra api
      - name: Restore the isolated browser runner and Chromium
        id: browser-runner-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ciq-playwright
            ${{ runner.temp }}/ciq-playwright-browsers
          key: browser-gates-${{ runner.os }}-node-22-playwright-${{ env.PLAYWRIGHT_VERSION }}-v1
      - name: Require the browser runner cache
        if: steps.browser-runner-cache.outputs.cache-hit != 'true'
        run: exit 1
      - name: Run the selected v2 ledger
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ciq-playwright-browsers
          SMOKE_BASE: ${{ needs.v2-ledger-plan.outputs.mode == 'smoke' && github.event.pull_request.base.sha || '' }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ciq-playwright/node_modules/playwright
        run: |
          args=()
          if [[ -n "$SMOKE_BASE" ]]; then args+=(--base "$SMOKE_BASE"); fi
          uv run python mockups/sweep/harmonic-v2-desktop/acceptance.py replay --viewport "${{ matrix.viewport }}" --shard "${{ matrix.shard }}" "${args[@]}" --out "$RUNNER_TEMP/v2-${{ matrix.viewport }}-${{ strategy.job-index }}"
      - name: Retain v2 acceptance output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-${{ matrix.viewport }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/v2-*/*.json
            ${{ runner.temp }}/v2-*/*.log
            ${{ runner.temp }}/v2-*/captures/


  frontend-browser:
    name: browser gates
    needs: [frontend-browser-leg, v2-ledger]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser gate leg to pass
        env:
          BROWSER_LEGS_RESULT: ${{ needs.frontend-browser-leg.result }}
          V2_RESULT: ${{ needs.v2-ledger.result }}
        run: test "$BROWSER_LEGS_RESULT" = success && test "$V2_RESULT" = success

  nightly-result:
    name: nightly result
    needs: [backend, docs, frontend, frontend-browser]
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compute the one nightly aggregate read by PRs and publication
        env:
          NIGHTLY_RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os,sys; sys.exit(not all(job["result"] == "success" for job in json.loads(os.environ["NIGHTLY_RESULTS"]).values()))'

  nightly-status:
    name: refresh nightly status on open PRs
    needs: nightly-result
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v5
      - name: Read and publish the nightly aggregate on current PR commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 mockups/sweep/harmonic-v2-desktop/acceptance.py nightly-publish --out "$RUNNER_TEMP/nightly-status"
      - name: Retain refreshed commit statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-statuses
          path: ${{ runner.temp }}/nightly-status/*.json

  docker-pr:
    name: build + smoke-test image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: harmonic:pr-test
      - name: Prove both packaged shells, assets, authentication and closed routes
        run: python3 mockups/sweep/harmonic-v2-desktop/acceptance.py package --image harmonic:pr-test --out "$RUNNER_TEMP/v2-package"
      - name: Retain packaged runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-packaged-runtime
          path: |
            ${{ runner.temp }}/v2-package/*.log
            ${{ runner.temp }}/v2-package/*.json

  docker:
    name: build + push image
    needs: [backend, frontend, frontend-browser]
    # Only on a real push to main — never on PRs or forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image paths must be lowercase; the repo name is mixed-case.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # latest tracks main; the full SHA gives a traceable pin.
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
      # Keep the 10 most recent published versions. A build pushing latest+SHA
      # is one version with two tags, so this keeps ~10 merges pullable.
      # min-versions-to-keep is a no-op when nothing is eligible for pruning.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: harmonic
          package-type: container
          min-versions-to-keep: 10
