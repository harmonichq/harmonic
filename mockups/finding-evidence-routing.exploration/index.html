<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finding → evidence routing · exploration</title>

  <!-- EXPLORATION DRAFT for issue #31 — not a lock, not a locked mock. No lock
       manifest, no ★ LOCKED header, no INDEX.md row.

       ROUND 2 MOCKS THE ARRIVAL, not one frozen frame. It opens at the ranked
       findings QUEUE, painted by the shipped `renderFindingsQueue` over the
       committed projection. Clicking a row performs the route: the canvas swaps
       to the lens and the inspector drills to that subject's case file. The
       drilled states are REACHED, never rendered as the initial state, and the
       `Findings` crumb walks back.

       Per the #31 resolution, the instrument row is GONE (no VIEW / FACTOR /
       FILTER strip). The inspector is the sole navigation and the canvas answers
       wherever it stands.

       CHROME IS THE SHIPPED APP'S, not a copy of it: the stylesheets below are
       the app's own files, loaded in the app's own order, and the cockpit topbar
       and footer are lifted out of the running app's DOM into
       chrome.extracted.html by harness.mjs. -->

  <script>
    // The app's own first-paint theme switch (frontend/index.html), verbatim.
    (function () {
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <!-- The app's stylesheets, in the app's order (frontend/index.html lines
       25-32, then its <style> blocks, then theme.css LAST). -->
  <link rel="stylesheet" href="../../frontend/scenario.css" />
  <link rel="stylesheet" href="../../frontend/shell.css" />
  <link rel="stylesheet" href="../../frontend/diagnose-workstation.css" />
  <link rel="stylesheet" href="../../frontend/diagnose-event-comparison.css" />
  <link rel="stylesheet" href="../../frontend/verify-workstation.css" />
  <link rel="stylesheet" href="./app-base.extracted.css" />
  <link rel="stylesheet" href="../../frontend/theme.css" />
  <!-- Scene-only rules. Nothing here re-states a token, a colour or a shipped
       component's metrics; every value is either a shipped declaration copied
       from its named sibling, or geometry this scene changes on purpose. -->
  <link rel="stylesheet" href="./scene.css" />
</head>
<body>
  <div id="app">
    <div class="cockpit-shell cockpit">
      <!-- topbar: injected from chrome.extracted.html -->
      <main class="cockpit-stage"><div class="main-content">
        <div id="diagnose-root">
          <section class="dw ec-surface fer-surface" data-state="typical">
            <main class="panes">

              <!-- ===================== canvas ===================== -->
              <!-- ONE canvas surface that answers wherever the inspector stands
                   (#31 ruling 1).

                   ROUND 4 ITEM 1 — and at the QUEUE level it answers nothing, so
                   it is not drawn at all. Round 3 kept this pane mounted at every
                   level and filled it, at the queue, with a POOLED GLUCOSE header
                   over 1010px of empty ground plus a paragraph explaining the
                   emptiness. The pane now collapses at that level (see
                   `.fer-surface[data-level="queue"]` in scene.css) and the
                   placeholder paragraph is DELETED rather than hidden — a
                   surface with nothing to say says nothing. -->
              <section class="pane canvas-pane ec-canvas" aria-label="Evidence canvas">
                <header class="canvas-head" id="ec-canvas-head" data-hover="0">
                  <div class="head-swap">
                    <!-- ROUND 2 ITEM 3 — the view name, and no factor name. The
                         finding's name prints ONCE, in the crumb. -->
                    <div class="head-line head-rest"><h2 id="canvas-title"></h2></div>
                    <div class="head-line head-live ec-canvas-readout" id="ec-readout" aria-hidden="true"><span class="ec-rd-time">--:--</span></div>
                  </div>
                  <span class="meta persist" id="canvas-persist"></span>
                </header>
                <div class="body">
                  <div id="ec-chart" class="ec-chart" role="img" tabindex="0"
                       aria-label="Low response comparison. Use left and right arrow keys to inspect five-minute points."></div>
                  <div class="ec-chart-key" id="ec-chart-key" aria-label="Cohort legend"></div>
                </div>
              </section>

              <!-- =================== inspector =================== -->
              <section class="pane inspector" aria-label="Inspector">
                <header><h2>Inspector</h2></header>
                <div class="body">
                  <!-- The crumb IS the navigation (old term 4). At the queue level
                       it is the inert root; drilled, the root becomes the button
                       that walks back and the leaf prints the subject's name —
                       the only place that name prints (round 2, item 3).

                       The shipped crumb meta ("30 days") is still not drawn: the
                       row holds the path and the scope chip, and at 430px the
                       three do not fit. Round 1 raised it; it stays open, and
                       `queue.meta` carries the string the level-1 queue would
                       print so the drop is visible rather than silent. -->
                  <div class="crumb">
                    <div class="trail" id="crumb-trail"></div>
                    <span class="fer-chip" id="scope-chip" hidden></span>
                  </div>
                  <div class="level" id="level" tabindex="-1"></div>
                </div>
                <div class="watch" id="watch-dock"></div>
              </section>

            </main>
          </section>
        </div>
      </div></main>
      <!-- footer: injected from chrome.extracted.html -->
    </div>
  </div>

  <script type="module" src="./surface.js"></script>
</body>
</html>
