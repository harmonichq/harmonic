  <!-- ★ LOCKED — harmonic-v2-desktop · 2026-09-08

       Direction selected by Connor Griffin on 2026-09-07 and recorded in
       "ADR 348 — Adopt the reviewed desktop direction"
       (openspec/changes/harmonic-v2/design.md). This header was written by
       Claude Opus 5 (high) as the #348 planning author. The contract is
       mockups/harmonic-v2-desktop.lock.md; that manifest governs, this header
       narrates. The locked surface is this file at ?source=journey.

       WHAT IS LOCKED. A fixed dark desk for a pump wearer reading their own
       data. Three destinations — Diagnose, Changes, Day — behind one
       persistent topbar and footer that do not move as the destination
       changes. Diagnose is the default; Changes owns the backend-selected active
       change or leading available priority and its next action. Diagnose carries
       the shipped v1 Findings rail as-is, including #395's Patterns, and owns
       clock-window exploration, detailed evidence, the selected case file,
       Spotlight and All Charts.
       Changes owns the Plan or Focus, follow-up progress, endings, saved
       conclusions, original records, history, reassessments and Pump
       settings. Day owns the five-track chronology, the week ribbon, its
       month, statistics and the Episode Log. Diagnose's evidence stage remains geometrically stable as the Findings, clock window and selected case change, under HV2-03–HV2-08.

       THE HIERARCHY THE REPAIR PASS SETTLED. An outcome is acknowledged on
       its own subject, and the subject does not change under the wearer.
       Every level has a visible parent: the roster, the Findings crumb in the
       basal lane's head, the global Diagnose control, and Escape. Set aside
       keeps the concern in hand with its reason, its roster group, a visible
       Restore, and the next ranked concern named in one press. A finished
       Trial opens on its own saved record before any other concern is
       offered. A Trial's Inspect nights opens the evidence that Trial was
       decided from, never the current read's first-ranked concern. A
       contextual Day entry carries its subject and returns to the exact
       target it left, including back into a utility.

       WHAT THE FRONTEND MAY NOT DECIDE. Identity, eligibility, readiness,
       admission, permissions, evidence populations, periods, comparison
       results, persistence and endings are served. No support floor, no
       direction, no staging verdict, no readiness criterion and no finishing
       permission is re-derived in the browser. Watch maturity copy is
       lifecycle metadata and supplies no evidence readiness; type-specific
       readiness comes from the selected record's retained comparison. There
       is no overall favorable verdict — favorable exists per outcome row.

       MATERIAL. Dark only. The shipped app's own token layer is the ground
       truth (frontend/index.html role ladder, frontend/shell.css rows,
       frontend/theme.css), not this mock's scaffold. Inter throughout, stage
       titles at 1.14rem/700/1.3/-.01em, tabular figures on clinical numbers.
       Charts render through the app's shipping renderers at its shipping
       ECharts version. The theme chooser and theme storage are retired; that
       retirement does not retire dark material.

       WHAT IS NOT LOCKED HERE. Mobile design and acceptance, root-route
       cutover, and v1 retirement are separate later gates: v1 stays served
       alongside /v2/ and is not retired by this lock. Fractional-hour chart
       speech is an inherited defect of the shipped comparison renderer's
       private axis formatter; its repair belongs in
       frontend/diagnose-event-comparison.js during the build, never in a
       v2-only formatter. Compact touch geometry belongs to the separately
       requested mobile round.

       PROTOTYPE-ONLY, AND IT NEVER SHIPS. The mock bar, the source, scenario,
       input and failure selects, the Review notes disclosure, and every
       page-memory decision are instrumentation. Nothing here persists across a
       refresh, and the capture holds no decision after the first, so a second
       sequential change cannot stage in this history.

       STILL OWED BEFORE DEPENDENT IMPLEMENTATION RESUMES. #389 amends its
       existing frozen behavior ledger and fail-closed replay, absent here. The
       complete synthetic fixture matrix, the verbatim-first port, the paired
       prototype/built-app fidelity evidence at 1280x720 and 1440x900, the
       one-row-per-term fidelity ledger, and human release acceptance follow
       in the build.
  -->
